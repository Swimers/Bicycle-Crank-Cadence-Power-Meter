# BLE peripheral using the on-chip SoftDevice Controller.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_DEVICE_NAME="CadenceSensor"
CONFIG_BT_MAX_CONN=1

# ANT/BLE multiprotocol, sdk-ant v2.1.1 + NCS v3.2.4.
# Official evaluation authorization: non-commercial development only.
CONFIG_ANT=y
CONFIG_ANT_EVALUATION_KEY=y
CONFIG_ANT_CHANNEL_CONFIG=y
CONFIG_ANT_KEY_MANAGER=y
CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED=1
CONFIG_ANT_ENCRYPTED_CHANNELS=0
CONFIG_HEAP_MEM_POOL_SIZE=4096

# I2C0 wiring and SC7A20H address are defined by the custom board DTS.
CONFIG_I2C=y

# Use the NUS UART as the application console.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_ZEPHYR_NUS_DEFAULT_INSTANCE=n
CONFIG_BT_ZEPHYR_NUS_AUTO_START_BLUETOOTH=n
CONFIG_UART_BT=y

# The sysbuild bootchain signs and links this application into slot0.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_REBOOT=y

# Board peripherals for the current hardware revision.
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_INPUT=y
