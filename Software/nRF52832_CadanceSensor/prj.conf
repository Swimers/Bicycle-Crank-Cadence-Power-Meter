# Cycling Speed and Cadence GATT notifications.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_DEVICE_NAME="CadenceSensor"
CONFIG_BT_DEVICE_APPEARANCE=1155
CONFIG_BT_MAX_CONN=1

# Request a 15 to 30 ms interval. The central determines the final parameters.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# The sysbuild bootchain signs and links this application into slot0.
CONFIG_BOOTLOADER_MCUBOOT=y

# Board peripherals for the current hardware revision.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_INPUT=y
