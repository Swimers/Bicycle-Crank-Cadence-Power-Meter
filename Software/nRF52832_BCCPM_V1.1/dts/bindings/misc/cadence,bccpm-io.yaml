description: BCCPM board control pins and battery ADC input.
compatible: "cadence,bccpm-io"
include: base.yaml
properties:
  bridge-en-gpios:
    type: phandle-array
    required: true
  pwms:
    type: phandle-array
    required: true
  pmic-mode-gpios:
    type: phandle-array
    required: true
  pmic-iset-gpios:
    type: phandle-array
    required: true
  bat-mon-en-gpios:
    type: phandle-array
    required: true
    description: Switched battery divider enable, active high.
  power-off-gpios:
    type: phandle-array
    required: true
    description: Physical POWER_OFF GPIO; ship trigger polarity and timing are not yet verified.
  io-channels:
    type: phandle-array
    required: true
