# Board bring-up only; sensor algorithms and BLE services are separate work.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PINCTRL=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_BOOT_BANNER=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_HEX=y
# The prototype board has X2 on P0.00/P0.01.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# Conservative assumption until the fitted crystal + temperature budget is verified.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Required for reliable short SPIM transfers on nRF52832.
CONFIG_NRF52_ANOMALY_58_WORKAROUND=y
